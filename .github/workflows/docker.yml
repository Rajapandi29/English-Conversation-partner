
name: Docker Build and Deploy

on:
  workflow_run:
    workflows:
      - "Terraform Apply"
    types:
      - completed

env:
  AWS_REGION: us-east-1

  FRONTEND_ECR_REPOSITORY: english-conversation-partner-frontend
  BACKEND_ECR_REPOSITORY: english-conversation-partner-backend

  ECS_CLUSTER: english-conversation-partner-cluster
  FRONTEND_ECS_SERVICE: english-conversation-partner-frontend
  BACKEND_ECS_SERVICE: english-conversation-partner-backend


jobs:
  docker:
    name: Build Push and Deploy
    runs-on: ubuntu-latest

    # Terraform Apply SUCCESS ஆனா மட்டும் Docker run ஆகும்
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: talk-ai

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Login to ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 4. Build Frontend Docker Image
      # --------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest \
            ./frontend

      # --------------------------------------------------
      # 5. Push Frontend Image
      # --------------------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest

      # --------------------------------------------------
      # 6. Build Backend Docker Image
      # --------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest \
            ./backend

      # --------------------------------------------------
      # 7. Push Backend Image
      # --------------------------------------------------
      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest

      # --------------------------------------------------
      # 8. Deploy Frontend ECS
      # --------------------------------------------------
      - name: Deploy frontend ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.FRONTEND_ECS_SERVICE }}" \
            --force-new-deployment

      # --------------------------------------------------
      # 9. Deploy Backend ECS
      # --------------------------------------------------
      - name: Deploy backend ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.BACKEND_ECS_SERVICE }}" \
            --force-new-deployment

      # --------------------------------------------------
      # 10. Wait Frontend Stable
      # --------------------------------------------------
      - name: Wait for frontend service
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.FRONTEND_ECS_SERVICE }}"

      # --------------------------------------------------
      # 11. Wait Backend Stable
      # --------------------------------------------------
      - name: Wait for backend service
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.BACKEND_ECS_SERVICE }}"

      # --------------------------------------------------
      # 12. Deployment Complete
      # --------------------------------------------------
      - name: Deployment complete
        run: |
          echo "=========================================="
          echo " English Conversation Partner"
          echo "=========================================="
          echo "Terraform Apply : SUCCESS"
          echo "Frontend image  : ${{ github.sha }}"
          echo "Backend image   : ${{ github.sha }}"
          echo "ECS cluster     : ${{ env.ECS_CLUSTER }}"
          echo "Deployment      : SUCCESS"
          echo "=========================================="

